<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - turnBasedFightingOnline</title>
    <link rel="stylesheet" href="style.css">
    <script src="connect.js" defer></script>
    <script src="animationsMainPage.js" defer></script>
</head>
<body>
    <div id="container">
        <div id="displayContainer">
            <h1>turnBasedFightingOnline</h1>
            <div>
                <label for="customIdCheckbox">Do you want to join a private server?:</label>
                <input type="checkbox" name="customIdCheckbox" id="customIdCheckbox">
            </div>
            <div id="customIdDiv">
                <label for="customId">Enter a custom code:</label>
                <input type="text" name="customId" id="customId">
            </div>
            <button id="connectBtn">CONNECT TO GAME</button>
            or
            <button id="localBtn">PLAY 2P LOCALLY</button>

            <button id="infoBtn">INFO ABOUT THE GAME</button>
            <p id="errors"></p>
        </div>
    </div>

    <img id="player0" class="playerImg" src="./assets/imgs/player0/idle0.png"></img>
    <img id="player1" class="playerImg" src="./assets/imgs/player1/idle0.png"></img>
</body>
</html>
